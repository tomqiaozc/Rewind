[project]
name = "rewind-backend"
version = "0.1.0"
description = "Rewind — AI coding session intelligence platform (backend)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "azure-storage-blob>=12.24.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Pydantic models need Optional[] and runtime datetime on Python 3.9
"src/core/types.py" = ["UP045", "TCH003"]
# Pydantic schemas need Optional[] and runtime datetime on Python 3.9
"src/schemas/*.py" = ["UP045", "TCH003"]
# SQLAlchemy models need runtime type annotations (Optional[], List[]) on Python 3.9
"src/models/*.py" = ["UP045", "UP006", "UP035"]
# FastAPI route files need Optional[] for runtime parameter annotation on Python 3.9
"src/api/*.py" = ["UP045", "TCH003"]
# main.py uses runtime type annotations for FastAPI dependency injection
"src/main.py" = ["TCH002"]

[tool.mypy]
python_version = "3.9"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
