[project]
name = "rewind-cli"
version = "0.1.0"
description = "Rewind CLI — sync AI coding sessions to Rewind platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.14.0",
    "httpx>=0.28.0",
    "rich>=13.9.0",
    "platformdirs>=4.3.0",
    "watchfiles>=1.0.0",
]

[project.scripts]
rewind = "src.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"src/core/*.py" = ["UP045", "TCH003"]
"src/parsers/*.py" = ["UP045", "TCH003"]
"src/drivers/*.py" = ["UP045", "TCH003"]
"src/upload/*.py" = ["UP045", "TCH003"]
"src/config/*.py" = ["UP045", "TCH003"]
"src/commands/*.py" = ["UP045", "TCH003"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
